name: Public stock inspection
on:
  push:
    branches: [feature/vansco-sale-campaign-workflow]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect public markup (bounded)
        run: |
          node --input-type=module <<'JS'
          for (const path of ["/all-stock/", "/sitemap/"]) {
            try {
              const response = await fetch("https://www.vansco.co.uk" + path, { headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36" }, signal: AbortSignal.timeout(12000) });
              const html = await response.text();
              console.log("STOCK_INSPECT", path, response.status, response.url);
              console.log("FORMS", (html.match(/<form\b[\s\S]*?<\/form>/gi) || []).map(x=>x.slice(0,20000)).join("\n").slice(0,40000));
              console.log("SCRIPTS", (html.match(/<script\b[^>]*src[^>]*>/gi)||[]).join("\n"));
              console.log("DATA", [...html.matchAll(/.{0,160}(?:registration|Registration|dealerkit|stockApi|api\.|RegNo|RegNumber|stockData|searchKeyword).{0,220}/g)].map(x=>x[0]).slice(0,60).join("\n"));
              console.log("LINKS", (html.match(/href=["'][^"']*(?:vehicle-details|all-stock)[^"']*["']/gi)||[]).slice(0,8).join("\n"));
            } catch (error) { console.log("STOCK_INSPECT_ERROR", path, error.message); }
          }
          JS
